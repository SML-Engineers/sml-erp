name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locks:
    name: Lock files present and current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Lock files exist
        run: |
          missing=0
          for f in backend/requirements.lock.txt backend/requirements-dev.lock.txt frontend/package-lock.json; do
            if [ ! -f "$f" ]; then echo "::error title=Missing lock file::$f"; missing=1; fi
          done
          exit $missing
      - name: Every pinned backend package carries a hash
        run: |
          if grep -E '^[A-Za-z0-9_.-]+==' backend/requirements*.lock.txt | grep -v -- '\\$'; then
            echo "::error title=Unhashed pin::Regenerate the lock files"; exit 1
          fi

  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    needs: [locks]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sml_erp
          POSTGRES_USER: sml
          POSTGRES_PASSWORD: ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sml -d sml_erp"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DATABASE_URL: postgres://sml:ci_password@localhost:5432/sml_erp
      FIELD_ENCRYPTION_KEY: f6wnK5t4CdeuHZ7cxu9MQ1saJFde3m_tRuIUCG28qsQ=  # CI only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.lock.txt
      - name: Install exact locked versions
        run: pip install --require-hashes -r requirements-dev.lock.txt
      - name: Lint
        run: ruff check .
      - name: Check no model change is missing a migration
        run: python manage.py makemigrations --check --dry-run
      - name: Show the missing migration
        if: failure()
        run: |
          out=$(python manage.py makemigrations --dry-run -v 3 2>&1 | tail -c 6000)
          echo "$out"
          body=$(printf '%s' "$out" | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Missing migration::$body"
      - name: Django deployment checks
        run: python manage.py check
      - name: Tests
        run: pytest 2>&1 | tee pytest.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Report test failures
        if: failure()
        shell: bash
        run: |
          [ -f pytest.log ] || exit 0
          body=$(grep -E "^(FAILED|ERROR)|Error|^E " pytest.log | tail -c 6000 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Backend test failures::$body"

  frontend:
    name: Frontend tests
    runs-on: ubuntu-24.04
    needs: [locks]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact locked versions
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build

  stack:
    name: Full stack (make up, make test)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: make up
        run: make up 2>&1 | tee make-up.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Report make up output on failure
        if: failure()
        shell: bash
        run: |
          body=$(tail -c 6000 make-up.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=make up output::$body"
      - name: Wait for the API through Nginx
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/health/; then echo; exit 0; fi
            sleep 5
          done
          echo "API did not become healthy" >&2
          exit 1
      - name: React app is served through Nginx
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ | grep -q 'id="root"'; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Background worker is running
        run: docker compose -f deploy/docker-compose.dev.yml --env-file .env ps worker --status running --quiet | grep -q .
      - name: make test
        run: make test
      - name: Show logs on failure
        if: failure()
        run: |
          compose="docker compose -f deploy/docker-compose.dev.yml --env-file .env"
          $compose ps -a
          $compose logs --tail=200
          # Also report as annotations, which are visible on the pull request's Checks tab.
          report() {
            body=$(printf '%s' "$2" | tail -c 6000 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$1::$body"
          }
          report "Services" "$($compose ps -a --format '{{.Service}} {{.State}} {{.Status}}' 2>&1)"
          for s in db redis storage backend worker frontend nginx; do
            report "Log: $s" "$($compose logs --no-color --tail=40 $s 2>&1)"
          done
      - name: make down
        if: always()
        run: make down
