name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sml_erp
          POSTGRES_USER: sml
          POSTGRES_PASSWORD: ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sml -d sml_erp"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DATABASE_URL: postgres://sml:ci_password@localhost:5432/sml_erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Check no model change is missing a migration
        run: python manage.py makemigrations --check --dry-run
      - name: Django deployment checks
        run: python manage.py check
      - name: Tests
        run: pytest
      - name: Record installed versions
        if: always()
        run: pip freeze --exclude-editable > installed-versions.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-installed-versions
          path: backend/installed-versions.txt

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-package-lock
          path: frontend/package-lock.json

  stack:
    name: Full stack (make up, make test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: make up
        run: make up
      - name: Wait for the API through Nginx
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/health/; then echo; exit 0; fi
            sleep 5
          done
          echo "API did not become healthy" >&2
          exit 1
      - name: React app is served through Nginx
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ | grep -q 'id="root"'; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Background worker is running
        run: docker compose -f deploy/docker-compose.dev.yml --env-file .env ps worker --status running --quiet | grep -q .
      - name: make test
        run: make test
      - name: Show logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.dev.yml --env-file .env logs --tail=200
      - name: make down
        if: always()
        run: make down
