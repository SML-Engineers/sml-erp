name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locks:
    name: Lock files present and current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Lock files exist
        run: |
          missing=0
          for f in backend/requirements.lock.txt backend/requirements-dev.lock.txt frontend/package-lock.json; do
            if [ ! -f "$f" ]; then echo "::error title=Missing lock file::$f"; missing=1; fi
          done
          exit $missing
      - name: Every pinned backend package carries a hash
        run: |
          if grep -E '^[A-Za-z0-9_.-]+==' backend/requirements*.lock.txt | grep -v -- '\\$'; then
            echo "::error title=Unhashed pin::Regenerate the lock files"; exit 1
          fi

  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    needs: [locks]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sml_erp
          POSTGRES_USER: sml
          POSTGRES_PASSWORD: ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sml -d sml_erp"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DATABASE_URL: postgres://sml:ci_password@localhost:5432/sml_erp
      FIELD_ENCRYPTION_KEY: f6wnK5t4CdeuHZ7cxu9MQ1saJFde3m_tRuIUCG28qsQ=  # CI only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.lock.txt
      - name: Install exact locked versions
        run: pip install --require-hashes -r requirements-dev.lock.txt
      - name: Lint
        run: ruff check .
      - name: Check no model change is missing a migration
        run: python manage.py makemigrations --check --dry-run
      - name: Show the missing migration
        if: failure()
        run: |
          out=$(python manage.py makemigrations --dry-run -v 3 2>&1 | tail -c 6000)
          echo "$out"
          body=$(printf '%s' "$out" | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Missing migration::$body"
      - name: Django deployment checks
        run: python manage.py check
      - name: Tests
        run: pytest 2>&1 | tee pytest.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Report test failures
        if: failure()
        shell: bash
        run: |
          [ -f pytest.log ] || exit 0
          body=$(grep -E "^(FAILED|ERROR)|Error|^E " pytest.log | tail -c 6000 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Backend test failures::$body"

  frontend:
    name: Frontend tests
    runs-on: ubuntu-24.04
    needs: [locks]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact locked versions
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build

  stack:
    name: Full stack (make up, make test)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    # The two slow checks (about 11 of the 19 minutes) run only on a pull request that is
    # ready for review, not on draft pushes or the run after merging (they already passed on
    # the pull request). Saves GitHub Actions minutes on the free plan (2,000 a month).
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v7
      - name: make up
        run: make up 2>&1 | tee make-up.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Report make up output on failure
        if: failure()
        shell: bash
        run: |
          body=$(tail -c 6000 make-up.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=make up output::$body"
      - name: Wait for the API through Nginx
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/health/; then echo; exit 0; fi
            sleep 5
          done
          echo "API did not become healthy" >&2
          exit 1
      - name: React app is served through Nginx
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ | grep -q 'id="root"'; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Background worker is running
        run: docker compose -f deploy/docker-compose.dev.yml --env-file .env ps worker --status running --quiet | grep -q .
      - name: make test
        run: make test
      - name: Show logs on failure
        if: failure()
        run: |
          compose="docker compose -f deploy/docker-compose.dev.yml --env-file .env"
          $compose ps -a
          $compose logs --tail=200
          # Also report as annotations, which are visible on the pull request's Checks tab.
          report() {
            body=$(printf '%s' "$2" | tail -c 6000 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$1::$body"
          }
          report "Services" "$($compose ps -a --format '{{.Service}} {{.State}} {{.Status}}' 2>&1)"
          for s in db redis storage backend worker frontend nginx; do
            report "Log: $s" "$($compose logs --no-color --tail=40 $s 2>&1)"
          done
      - name: make down
        if: always()
        run: make down

  production:
    name: Production stack (HTTPS, as on the servers)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    # See the stack job: only on a pull request that is ready for review.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    env:
      ENV_FILE: ${{ github.workspace }}/.env.production
      APP_VERSION: ci
    steps:
      - uses: actions/checkout@v7
      - name: Scripts have no syntax errors
        run: |
          for f in deploy/scripts/*.sh; do bash -n "$f"; done
          sh -n deploy/web/entrypoint.sh
      - name: Environment file from the real script
        run: deploy/scripts/make-env.sh production localhost it@example.com
      - name: Build and start
        run: |
          docker compose -f deploy/docker-compose.prod.yml --env-file "$ENV_FILE" build 2>&1 | tail -n 40
          docker compose -f deploy/docker-compose.prod.yml --env-file "$ENV_FILE" up -d
      - name: The API answers over HTTPS
        run: |
          for i in $(seq 1 60); do
            if curl -fsSk https://localhost/api/v1/health/; then echo; exit 0; fi
            sleep 5
          done
          exit 1
      - name: HTTP goes to HTTPS, the app is served, security headers are set
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/vouchers)
          test "$code" = "301"
          curl -fsSk https://localhost/vouchers/123 | grep -q 'id="root"'
          headers=$(curl -fsSk -D - -o /dev/null https://localhost/api/v1/health/)
          echo "$headers"
          echo "$headers" | grep -qi '^strict-transport-security:'
          echo "$headers" | grep -qi '^content-security-policy:'
          test "$(echo "$headers" | grep -ci '^x-frame-options:')" = "1"
          # Debug pages are off: an unknown address gives a plain 404, not Django's error page.
          ! curl -sk https://localhost/api/v1/no-such-page/ | grep -q 'Django'
      - name: Background worker and scheduler are running
        run: |
          compose="docker compose -f deploy/docker-compose.prod.yml --env-file $ENV_FILE"
          $compose ps worker --status running --quiet | grep -q .
          $compose ps scheduler --status running --quiet | grep -q .
      - name: Backup, wipe everything, restore (round trip)
        env:
          APP_DIR: ${{ github.workspace }}
          BACKUP_ENV: ${{ runner.temp }}/backup.env
          BACKUP_WORK: ${{ runner.temp }}/backups
        run: |
          compose="docker compose -f deploy/docker-compose.prod.yml --env-file $ENV_FILE"
          django() { $compose exec -T backend python manage.py shell -c "$1"; }
          wait_up() {
            for i in $(seq 1 60); do curl -fsSk https://localhost/api/v1/health/ >/dev/null && return 0; sleep 5; done
            return 1
          }
          deploy/scripts/make-backup-env.sh "${{ runner.temp }}/backup-repository"
          django "
          from django.core.files.base import ContentFile
          from django.core.files.storage import default_storage
          from apps.core.models import User
          User.objects.create_user('restore.check@example.com', 'Restore Check', 'Restore-Check-2026')
          default_storage.save('checks/restore.txt', ContentFile(b'scanned invoice'))
          "
          CHECK=1 deploy/scripts/backup.sh
          $compose down -v                 # every volume deleted: database and files gone
          $compose up -d && wait_up
          django "
          from apps.core.models import User
          assert not User.objects.filter(email='restore.check@example.com').exists()
          "
          RESTORE_CONFIRMED=yes deploy/scripts/restore.sh latest
          django "
          from django.core.files.storage import default_storage
          from apps.core.models import User
          assert User.objects.filter(email='restore.check@example.com').exists(), 'user not restored'
          assert default_storage.open('checks/restore.txt').read() == b'scanned invoice', 'file not restored'
          print('Restore check: database and files are back.')
          "
      - name: Show logs on failure
        if: failure()
        run: |
          compose="docker compose -f deploy/docker-compose.prod.yml --env-file $ENV_FILE"
          $compose ps -a
          report() {
            body=$(printf '%s' "$2" | tail -c 6000 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$1::$body"
          }
          report "Services" "$($compose ps -a --format '{{.Service}} {{.State}} {{.Status}}' 2>&1)"
          for s in db storage migrate backend worker scheduler web; do
            report "Log: $s" "$($compose logs --no-color --tail=40 $s 2>&1)"
          done
