# Development stack. Start it from the repository root with `make up`,
# then open http://localhost:8080.
name: sml-erp

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible file storage for scanned invoices and drawings (SeaweedFS, Apache 2.0).
  # The access key comes from .env; anonymous access is not allowed.
  storage:
    image: chrislusf/seaweedfs:4.48
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf '{"identities":[{"name":"sml-erp","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - storage-data:/data

  backend:
    build:
      context: ../backend
    env_file: ../.env
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py ensure_storage_bucket &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ../backend:/app
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_started }

  worker:
    build:
      context: ../backend
    env_file: ../.env
    command: celery -A config worker --loglevel=info
    volumes:
      - ../backend:/app
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ../frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ../frontend:/app
      - /app/node_modules

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend

volumes:
  db-data:
  storage-data:
