# Test and production servers (Hostinger Ubuntu VPS). Run through deploy/scripts/deploy.sh,
# which passes the server's environment file (never committed):
#   docker compose -f deploy/docker-compose.prod.yml --env-file /srv/sml-erp/.env.production ...
# Only the web container is reachable from outside, on ports 80 and 443.
name: sml-erp

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-backend: &backend
  build:
    context: ../backend
    args: { INSTALL_DEV: "false" }
  image: sml-erp-backend:${APP_VERSION:-latest}
  env_file: ${ENV_FILE:?Set ENV_FILE to the server's environment file}
  environment:
    APP_VERSION: ${APP_VERSION:-unknown}  # the deployed version, shown by /api/v1/health/
  restart: unless-stopped
  logging: *logging

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  # Scanned invoices and other files (S3-compatible, docs/decisions/0002).
  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf '{"identities":[{"name":"sml-erp","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - storage-data:/data
    logging: *logging

  # Applies database changes and prepares file storage, then stops; the application
  # starts only when it has succeeded.
  migrate:
    <<: *backend
    restart: "no"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py ensure_storage_bucket"
    depends_on:
      db: { condition: service_healthy }
      storage: { condition: service_started }

  backend:
    <<: *backend
    command: >
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-3} --timeout 120 --access-logfile -
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=info --concurrency=2
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Scheduled jobs: reminders, notification emails, housekeeping.
  scheduler:
    <<: *backend
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    image: sml-erp-web:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      backend: { condition: service_healthy }
    logging: *logging

  # Renews the Let's Encrypt certificate (checks twice a day; renews 30 days before expiry).
  certbot:
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    logging: *logging

volumes:
  db-data:
  redis-data:
  storage-data:
  letsencrypt:
  certbot-webroot:
