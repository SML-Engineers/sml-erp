# Development: one address (http://localhost:8080) for both the React app and the API.
server {
    listen 80;
    client_max_body_size 25m;  # scanned invoices; the API enforces the 20 MB limit

    # Look the containers up again on every request (Docker's own DNS), so a rebuilt
    # backend or frontend with a new address is found without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    set $frontend http://frontend:5173;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass $backend;
    }

    location / {
        proxy_pass $frontend;
        proxy_set_header Host $host;
        # Live reload of the React app while developing
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
